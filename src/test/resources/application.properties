# 测试使用随机端口；缩短熔断窗口以获得稳定快速的恢复验证
server.port=0

gateway.instances[0].id=up-a
gateway.instances[0].base-url=mock://up-a
gateway.instances[0].max-concurrent=2
gateway.instances[0].max-per-second=1000

gateway.instances[1].id=up-b
gateway.instances[1].base-url=mock://up-b
gateway.instances[1].max-concurrent=2
gateway.instances[1].max-per-second=1000

gateway.instances[2].id=up-c
gateway.instances[2].base-url=mock://up-c
gateway.instances[2].max-concurrent=2
gateway.instances[2].max-per-second=5

gateway.instances[3].id=up-d
gateway.instances[3].base-url=mock://up-d
gateway.instances[3].max-concurrent=2
gateway.instances[3].max-per-second=1000

gateway.instances[4].id=up-dead
gateway.instances[4].base-url=dead://closed-port
gateway.instances[4].max-concurrent=4
gateway.instances[4].max-per-second=1000

gateway.routes[0].id=orders-route
gateway.routes[0].path-prefix=/api/orders
gateway.routes[0].instances=up-a,up-b,up-d,up-dead

gateway.routes[1].id=payment-route
gateway.routes[1].path-prefix=/api/payment
gateway.routes[1].instances=up-c

gateway.routes[2].id=generic-route
gateway.routes[2].path-prefix=/gw
gateway.routes[2].instances=up-a,up-b

gateway.breaker-failure-threshold=3
gateway.breaker-open-millis=1200
gateway.breaker-half-open-permits=1

gateway.retry-max-attempts=3
gateway.retry-total-timeout-millis=3000
gateway.call-timeout-millis=1500

# 测试/排障专用：只含单一实例的路由（行为确定性）
gateway.routes[3].id=dead-only-route
gateway.routes[3].path-prefix=/api/dead-only
gateway.routes[3].instances=up-dead

gateway.routes[4].id=a-only-route
gateway.routes[4].path-prefix=/api/a-only
gateway.routes[4].instances=up-a

# 故障转移验证专用：顺序固定为 坏->坏->好（配合 fail-first-n 管理接口）
gateway.routes[5].id=failover-route
gateway.routes[5].path-prefix=/api/failover
gateway.routes[5].instances=up-a,up-b,up-d
server.max-http-response-header-size=32KB
