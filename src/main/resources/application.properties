# 本地演示：启动与配置对应的模拟上游
gateway.mock-upstreams.enabled=true

# 上游实例配置
gateway.upstreams[0].id=upstream-a
gateway.upstreams[0].host=127.0.0.1
gateway.upstreams[0].port=19001
gateway.upstreams[0].max-concurrency=10
gateway.upstreams[0].rate-limit-per-second=50
gateway.upstreams[0].weight=1

gateway.upstreams[1].id=upstream-b
gateway.upstreams[1].host=127.0.0.1
gateway.upstreams[1].port=19002
gateway.upstreams[1].max-concurrency=10
gateway.upstreams[1].rate-limit-per-second=50
gateway.upstreams[1].weight=1

# 路由规则：/gateway/orders/** -> upstream-a / upstream-b
gateway.routes[0].route-id=orders
gateway.routes[0].path-prefix=/orders
gateway.routes[0].upstream-ids[0]=upstream-a
gateway.routes[0].upstream-ids[1]=upstream-b

# 重试与超时预算
gateway.max-retries=2
gateway.overall-timeout-ms=3000
gateway.per-attempt-timeout-ms=1000

# 熔断参数
gateway.circuit-failure-threshold=3
gateway.circuit-open-duration-ms=5000
gateway.circuit-half-open-permits=1
